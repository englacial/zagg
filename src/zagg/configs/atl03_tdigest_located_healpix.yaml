# ATL03 photon-height t-digest with a morton location channel (issue #87).
#
# The located variant of atl03_tdigest_healpix.yaml: identical read plan, grid,
# and t-digest sketch, plus ``location: leaf_id`` on the ragged field. Each
# centroid then also carries a high-resolution morton location -- the deepest
# HEALPix cell enclosing the photons merged into it, computed by folding their
# order-29 point-kind morton words (``HealpixGrid.assign``) through
# ``mortie.common_ancestor``. A one-photon centroid stores its exact order-29
# point word. On disk the locations are a uint64 companion vlen array
# (the ``{field}_locations`` sibling, issue #209) row-aligned with the float32
# digest -- one logical multivariable field, two physical arrays, each channel
# lossless in its own dtype (an order-29 word exceeds float64's 2^53 exact-int
# ceiling, so no interleaved float layout can carry it). Read the channel back
# with ``zagg.readers.read_locations``; decode/coarsen/query the packed words
# with mortie primitives (``mort2healpix``, ``clip2order``, ``common_ancestor``).
data_source:
  reader: h5coro
  driver: s3
  groups: [gt1l, gt1r, gt2l, gt2r, gt3l, gt3r]
  coordinates:
    latitude: "/{group}/heights/lat_ph"
    longitude: "/{group}/heights/lon_ph"
  variables:
    h_ph: "/{group}/heights/h_ph"
    # Per-photon transmit time, the clock the section-8.3 temporal companion
    # encodes from (issue #410). Photon-rate on ATL03 (heights/delta_time), so
    # no segment broadcast is needed.
    delta_time: "/{group}/heights/delta_time"
  filters:
    - dataset: "/{group}/heights/signal_conf_ph"
      column: 0                  # land surface type; TEP is uniform across columns
      op: ne
      value: -2
  base_level: photons
  levels:
    photons:
      path: "/{group}/heights"
      coordinates: {latitude: lat_ph, longitude: lon_ph}
      link: null
    segments:
      path: "/{group}/geolocation"
      coordinates: {latitude: reference_photon_lat, longitude: reference_photon_lon}
      link:
        to: photons
        index_beg: "/{group}/geolocation/ph_index_beg"
        count: "/{group}/geolocation/segment_ph_cnt"
        index_base: 1            # ATL03 ph_index_beg is 1-based per the v3 dict
  read_plan:
    spatial_index: segments
    pad: 1                       # one segment of padding on each side per #43

aggregation:
  coordinates:
    morton:
      dtype: uint64
      fill_value: 0
  variables:
    count:
      function: len
      source: h_ph
      dtype: int32
      fill_value: 0
    h_tdigest:
      # Located per-cell t-digest: ``build_tdigest`` receives the cell's
      # per-photon order-29 morton words (``locations=leaf_id``) and returns a
      # ``(digest, locations)`` pair -- the (n_centroids, 2) float32 (mean,
      # weight) array plus the (n_centroids,) uint64 per-centroid location
      # vector, stored as the companion vlen array described above.
      kind: ragged
      function: "zagg.stats.tdigest.build_tdigest"
      source: h_ph
      location: leaf_id
      # Per-centroid toc words beside the located ones (spec section 8.3, issue
      # #410): the envelope of the photons merged into each centroid, exact to
      # the nanosecond while a centroid is one photon. Per-centroid at EVERY
      # pyramid level, symmetric with the located channel (espg-ruled
      # 2026-08-17). Stored as the {field}_times sibling, bound from the
      # payload's `times` attr. NOTE zagg.readers has no helper for this channel
      # yet: read_locations binds the section 9 `ragged.locations` key only, and
      # read_raw_values decodes a (n, 2) digest, not a flat word vector. Until
      # one exists, decode the sibling directly -- it is an ordinary ragged
      # uint64 vlen array whose element dtype/shape its own `ragged` attrs
      # declare -- and interpret the words with mortie (toc_is_range, toc2time).
      temporal: per-centroid
      inner_shape: [2]
      params:
        delta: 4096              # leaf centroid budget (espg ruling 2026-09-13): the
                                 # live stores' value, and loss-free for every
                                 # surface cell measured -- the CA tail scan on
                                 # issue #422 puts 1e-5 of cells above it, all
                                 # cloud/background storm artifacts
      overview_delta: 512        # pyramid-fold budget: ~1/512 accuracy (issue #424)
      dtype: float32
      fill_value: 0

output:
  # The store's per-observation clock (issue #410): the column a temporal
  # companion's toc words are encoded from, plus the conversion that reaches the
  # grammar's continuous scale. ATLAS `delta_time` is GPS-continuous seconds
  # since the SDP epoch, so `scale: gps` is exact offset arithmetic -- no leap
  # table in the hot path. A `utc`-scale column would be refused by name (spec
  # section 8.3 wants an instant exact to the nanosecond).
  time_source:
    field: delta_time
    epoch: "2018-01-01T00:00:00"
    scale: gps
    units: seconds
  grid:
    type: healpix
    indexing_scheme: nested
    parent_order: 11             # shard / dispatch unit: 4^(19-11) = 256x256 cells
    chunk_inner: 13              # inner Zarr chunk: 4^(19-13) = 64x64 cells (K=16 per shard)
    # ShardingCodec output (issue #108/#133, decided on the #170 read-matrix
    # evidence 2026-07-07): at identical reads, sharded collapses the
    # per-inner-chunk aggregation grouping + K per-inner-chunk writes (o9: agg 165->19 s,
    # write 148->15 s per worker; -44% cost vs inner). The benchmark matrix
    # keeps both codecs as explicit A/B columns.
    sharded: true
    child_order: 19              # leaf cell resolution (~10 m)
