aggregation:
  coordinates:
    morton:
      dtype: uint64
      fill_value: 0
  streaming:
    buffer_granules: 8
    mode: spill
  variables:
    count:
      dtype: int32
      fill_value: 0
      function: len
      source: rxwaveform
    elevation_bin0:
      dtype: float64
      fill_value: NaN
      function: zagg.stats.waveform.single_shot_value
      source: elevation_bin0
    elevation_lastbin:
      dtype: float64
      fill_value: NaN
      function: zagg.stats.waveform.single_shot_value
      source: elevation_lastbin
    noise_mean:
      dtype: float32
      fill_value: NaN
      function: zagg.stats.waveform.single_shot_value
      source: noise_mean
    noise_stddev:
      dtype: float32
      fill_value: NaN
      function: zagg.stats.waveform.single_shot_value
      source: noise_stddev
    rx_energy:
      dtype: float32
      fill_value: NaN
      function: zagg.stats.waveform.single_shot_value
      source: rx_energy
    rx_flux:
      attrs:
        clip: threshold-to-zero
        gain:
          name: unit
          value: 1.0
          version: gedi01b-v002-placeholder
        operating_point:
          correlation_length: 5
          false_positive_rate: 0.001
          samples_per_record: 1420
      dtype: float32
      fill_value: 0
      function: zagg.stats.waveform.build_waveform_digest
      inner_shape:
      - 2
      kind: ragged
      params:
        correlation_length: 5
        counts: rxwaveform
        delta: 4096
        false_positive_rate: 0.001
        gain: 1.0
        noise_mean: noise_mean
        noise_stddev: noise_stddev
        samples_per_record: 1420
      source: elevation
      temporal: per-centroid
      weights: flux
    shot_count:
      dtype: int32
      fill_value: 0
      function: zagg.stats.waveform.shot_count
      source: shot_number
    shot_number:
      dtype: uint64
      fill_value: 0
      function: zagg.stats.waveform.shot_number
      source: shot_number
bounds: null
catalog: null
data_source:
  assets:
    l2a:
      join:
        left: /{group}/shot_number
        right: /{group}/shot_number
  base_level: samples
  coordinates:
    latitude: /{group}/geolocation/latitude_bin0
    level: shots
    longitude: /{group}/geolocation/longitude_bin0
  credentials_provider: lpdaac
  driver: s3
  filters:
  - dataset: /{group}/geolocation/degrade
    level: shots
    op: eq
    value: 0
  - asset: l2a
    dataset: /{group}/rx_assess/rx_clipbin_count
    op: le
    value: 0
  - expression: abs((elevation_bin0 + elevation_lastbin)/2 - digital_elevation_model)
      <= 200
  groups:
  - BEAM0000
  - BEAM0001
  - BEAM0010
  - BEAM0011
  - BEAM0101
  - BEAM0110
  - BEAM1000
  - BEAM1011
  index:
    backend: hierarchical
  levels:
    samples:
      link: null
      path: /{group}
    shots:
      coordinates:
        latitude: latitude_bin0
        longitude: longitude_bin0
      link:
        count: /{group}/rx_sample_count
        index_base: 1
        index_beg: /{group}/rx_sample_start_index
        to: samples
      path: /{group}/geolocation
      variables:
        delta_time: /{group}/geolocation/delta_time
        digital_elevation_model:
          asset: l2a
          path: /{group}/digital_elevation_model
        elevation_bin0: /{group}/geolocation/elevation_bin0
        elevation_lastbin: /{group}/geolocation/elevation_lastbin
        noise_mean: /{group}/noise_mean_corrected
        noise_stddev: /{group}/noise_stddev_corrected
        rx_energy: /{group}/rx_energy
        shot_number: /{group}/shot_number
  read_plan:
    pad: 1
    spatial_index: shots
  reader: h5coro
  shard_workers: 4
  variables:
    elevation:
      level: shots
      start: /{group}/geolocation/elevation_bin0
      stop: /{group}/geolocation/elevation_lastbin
      synthesize: linspace
    rxwaveform: /{group}/rxwaveform
output:
  grid:
    child_order: 18
    chunk_inner: 12
    indexing_scheme: nested
    parent_order: 9
    sharded: true
    type: healpix
  pyramid: false
  store_layout: hive
  time_source:
    epoch: '2018-01-01T00:00:00'
    field: delta_time
    scale: gps
    units: seconds
pipeline:
  type: spatial
worker:
  extra_disk: true
  memory: 4096
