AWSTemplateFormatVersion: "2010-09-09"
# CI/CD IAM roles + public distribution bucket for the Lambda benchmark + deploy
# pipeline (issues #110, #25). Kept in its OWN stack (separate from the runtime
# backend template.yaml) so it rolls back / tears down cleanly and an account
# admin applies it once. Companion to docs/deployment/benchmark-cicd.md, which
# also documents the equivalent raw-CLI path.
#
# Provisions the THREE GitHub-OIDC roles the workflows assume, plus the public,
# listable distribution bucket. It does NOT create: the GitHub OIDC provider
# (already account-global -- referenced by ARN below), the runtime Lambda(s) /
# their execution roles (template.yaml), the benchmark OUTPUT bucket (the backend
# stack's OutputBucketName), or any GitHub-side resource (repo vars/secrets, the
# `benchmarks` branch, the `benchmark` label, the `production` Environment, tag
# protection) -- those aren't AWS resources. Copy the Outputs into the
# `gh variable set BENCHMARK_*/LAMBDA_*` step.
Description: >-
  zagg CI/CD: GitHub-OIDC roles (benchmark-invoke, test-deploy, release) and the
  public sliderule-public-cors distribution bucket. See benchmark-cicd.md.

Parameters:
  GitHubRepo:
    Type: String
    Default: englacial/zagg
    Description: owner/repo whose Actions may assume these roles (the OIDC `sub`).

  BenchmarkFunctionName:
    Type: String
    Default: process-shard
    Description: Stable function the benchmark invokes (and prod deploy target).

  TestFunctionName:
    Type: String
    Default: process-shard-test
    Description: Test function the tier-2 deploy updates + the benchmark invokes.

  BenchmarkStoreBucket:
    Type: String
    Default: sliderule-public
    Description: >-
      Bucket the staged test layer (lambda-test/*) is uploaded to; the deploy role
      is scoped to it. (The benchmark output store is written by the Lambda's
      execution role, not these roles.)

  DistBucketName:
    Type: String
    Default: sliderule-public-cors
    Description: Public, listable bucket the release distributes the zips to.

  CreateDistBucket:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create DistBucketName here, or set false to use an existing one.

  BenchmarkInvokeRoleName:
    Type: String
    Default: zagg-benchmark
  DeployRoleName:
    Type: String
    Default: zagg-benchmark-deploy
  ReleaseRoleName:
    Type: String
    Default: zagg-lambda-release

Conditions:
  ShouldCreateDistBucket: !Equals [!Ref CreateDistBucket, "true"]

Resources:
  # --- public distribution bucket (issue #25 §10) ----------------------------
  DistBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateDistBucket
    Properties:
      BucketName: !Ref DistBucketName
      # Public read is granted by the bucket POLICY below (not ACLs), so the ACL
      # blocks stay on; only the policy/restrict blocks are relaxed. NOTE: this
      # can't override ACCOUNT-level Block Public Access -- relax that separately
      # (see benchmark-cicd.md §10) if enabled.
      # HISTORICAL, read this before trusting the block below: the LIVE bucket
      # has all four Block Public Access flags true and anonymous GET 403s. That
      # is not drift -- espg closed it deliberately, because NASA buckets have
      # no clearance to host public data (issue #497). The bucket is being
      # retired under issue #499; published artifacts go to Source Cooperative
      # (the PublishToSourceCoop grant below).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedHeaders: ["*"]
            # Let browser clients read these off a cross-origin response -- needed
            # for HTTP byte-range reads (Content-Range/Accept-Ranges/ETag aren't
            # CORS-safelisted, so JS can't see them unless exposed).
            ExposedHeaders: [Content-Length, Content-Range, Content-Type, ETag, Accept-Ranges]

  DistBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateDistBucket
    Properties:
      Bucket: !Ref DistBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadList
            Effect: Allow
            Principal: "*"
            Action: [s3:GetObject, s3:ListBucket]
            Resource:
              - !Sub "arn:aws:s3:::${DistBucketName}"
              - !Sub "arn:aws:s3:::${DistBucketName}/*"

  # --- benchmark invoke role (issue #110 §2) ---------------------------------
  BenchmarkInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref BenchmarkInvokeRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:*"
      # S3 writes still happen INSIDE the Lambda (runner.py: the Zarr template /
      # data writes need no orchestrator S3 access). The one orchestrator read
      # is the async result poll (issue #151): workers mirror per-shard result
      # JSON to <store>.status/<run_id>/ and the runner GETs it.
      Policies:
        - PolicyName: invoke-and-probe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Enumerated exact ARNs (issue #341): the former
              # ${...FunctionName}* wildcards were declined -- enumeration
              # keeps least privilege. Each family lists its base function
              # plus the variants template.yaml provisions for it (prod:
              # WorkerSizeVariants + WorkerDiskVariants, plain + -disk; test:
              # WorkerTestDiskVariants, -disk only). All invokes/probes are
              # unqualified ($LATEST), so no :qualifier ARN forms are needed.
              # Drift vs the matrix is guarded by tests/test_deploy_lambda.py.
              - Sid: InvokeBenchmarkFunctions
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-2048"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-4096"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-8192"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-2048-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-4096-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-8192-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}-2048-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}-4096-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}-8192-disk"
              # Pre-flight worker-sizing probe (issue #28/#63 via concurrency.py);
              # these degrade gracefully but are needed for the guard to work.
              # Neither action supports resource-level scoping -> "*".
              - Sid: ConcurrencyProbe
                Effect: Allow
                Action: [lambda:GetAccountSettings, cloudwatch:GetMetricStatistics]
                Resource: "*"
              # Async-dispatch result polling (issue #151): read the per-shard
              # result objects the workers write next to the benchmark output
              # store (BENCHMARK_STORE_PREFIX lives in this bucket).
              - Sid: PollAsyncResults
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${BenchmarkStoreBucket}/*"
              # Object-count metric (issue #240/#242): the harness LISTs the
              # output store after each run to count objects (sharded-write
              # bypass guard). Scoped to the benchmark prefix.
              - Sid: ListBenchmarkStore
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BenchmarkStoreBucket}"
                Condition:
                  StringLike:
                    s3:prefix: "zagg-bench/*"

  # --- tier-2 test-deploy role (issue #25 §9) --------------------------------
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeployRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:*"
      Policies:
        - PolicyName: deploy-test-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Enumerated exact ARNs (issue #341): a ${TestFunctionName}*
              # wildcard was proposed and declined -- enumeration keeps least
              # privilege. Base function plus exactly the variants the test
              # stack provisions (template.yaml's WorkerTestDiskVariants loop
              # over WorkerMemorySizes: the -disk trio only). Drift against
              # that matrix is guarded by tests/test_deploy_lambda.py.
              - Sid: UpdateTestFunction
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  # deploy_lambda.sh pins async retries to 0 (issue #151).
                  - lambda:PutFunctionEventInvokeConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}-2048-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}-4096-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TestFunctionName}-8192-disk"
              - Sid: PublishTestLayer
                Effect: Allow
                # GetLayerVersion: update-function-configuration --layers validates
                # the layer version (acts on the versioned ARN, hence the :* resource).
                Action: [lambda:PublishLayerVersion, lambda:GetLayerVersion]
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${TestFunctionName}-deps"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${TestFunctionName}-deps:*"
              - Sid: StageTestLayer
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${BenchmarkStoreBucket}/lambda-test/*"

  # --- tier-3 release role (issue #25 §9) ------------------------------------
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ReleaseRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:*"
      Policies:
        - PolicyName: deploy-prod-and-distribute
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Enumerated exact ARNs (issue #341): a ${BenchmarkFunctionName}*
              # wildcard was proposed and declined -- enumeration keeps least
              # privilege. Base function plus the full prod worker-size family
              # (template.yaml's WorkerSizeVariants + WorkerDiskVariants loops
              # over WorkerMemorySizes: plain + -disk), plus the -extract twin
              # (template.yaml's ExtractFn -- same code zip, so the release must
              # redeploy it or it stays on standup-time code, issue #341's
              # failure mode; it is dispatched by explicit name for full-archive
              # extraction, issue #148, and never by suffix resolution, so the
              # INVOKE role deliberately does not enumerate it -- the benchmark
              # harness never touches it). Drift against that matrix is guarded
              # by tests/test_deploy_lambda.py.
              - Sid: UpdateProdFunction
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  # deploy_lambda.sh pins async retries to 0 (issue #151).
                  - lambda:PutFunctionEventInvokeConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-2048"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-4096"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-8192"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-2048-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-4096-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-8192-disk"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BenchmarkFunctionName}-extract"
              - Sid: PublishProdLayer
                Effect: Allow
                # GetLayerVersion: update-function-configuration --layers validates
                # the layer version (acts on the versioned ARN, hence the :* resource).
                Action: [lambda:PublishLayerVersion, lambda:GetLayerVersion]
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${BenchmarkFunctionName}-deps"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${BenchmarkFunctionName}-deps:*"
              - Sid: DistributeZips
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${DistBucketName}/*"
              # Published destination (issue #497): the release role's half of
              # the identity model template.yaml's ExecutionRole carries for the
              # fleet (issue #495) -- same statement shape, different trust
              # domain, which is why this stays a SEPARATE role rather than a
              # widened zagg-lambda-execution. The role already exists with the
              # right trust (GitHub Actions OIDC, above); it needed S3
              # permissions, not an identity.
              #
              # Scoped to englacial/zagg/lambda/* -- the per-minor zips,
              # SHA256SUMS and the versions.json index that distribute_zips.sh /
              # publish_mirror.sh write. NOT englacial/zagg/benchmarks/*:
              # whether the measurement artifacts migrate is question (1) of
              # issue #497 and is unresolved, so the grant does not pre-empt it.
              # DeleteObject is deliberately absent -- a re-published minor
              # overwrites via PutObject and the mirror never prunes.
              #
              # PutObjectAcl is load-bearing, not incidental: every write here
              # carries x-amz-acl: bucket-owner-full-control, which S3 evaluates
              # against s3:PutObjectAcl on both PutObject and
              # CreateMultipartUpload -- without it the first published PUT is
              # AccessDenied (issue #496; the two halves are only correct
              # together). Granted HERE ONLY: the header is not sent to
              # DistBucketName, whose objects we already own.
              #
              # The multipart actions cover the FAILURE path PutObject does not:
              # the layer zips are large enough that the aws CLI uploads them
              # multipart, and without AbortMultipartUpload the CLI's own
              # cleanup 403s, leaving parts invisible to ListObjects and billed
              # to Source Cooperative. ListMultipartUploadParts is object-scoped
              # and stays with it. ListBucketMultipartUploads is deliberately
              # NOT granted: it is bucket-wide (s3:prefix cannot constrain it),
              # so Source Cooperative's bucket policy does not grant it and
              # holding it here would be denied cross-account anyway (espg,
              # 2026-08-20). Leaked parts age out on their 7-day lifecycle rule.
              - Sid: PublishToSourceCoop
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - arn:aws:s3:::us-west-2.opendata.source.coop/englacial/zagg/lambda/*
                  # The repo-root metadata publish_mirror.sh also writes (its
                  # MIRROR_REPO_PREFIX block): the version-independent index and
                  # the code license. Enumerated as exact keys rather than an
                  # englacial/zagg/* wildcard so the grant cannot reach demo/
                  # (the fleet's) or benchmarks/ (undecided).
                  - arn:aws:s3:::us-west-2.opendata.source.coop/englacial/zagg/README.md
                  - arn:aws:s3:::us-west-2.opendata.source.coop/englacial/zagg/LICENSE
              # Unconditional by intent -- do NOT add an s3:prefix condition.
              # S3 answers a GET on a missing key with 404 NoSuchKey only when
              # the caller holds s3:ListBucket on the bucket; otherwise it
              # answers 403 AccessDenied. A GetObject request carries no
              # s3:prefix context key, so a StringLike on it never matches
              # during a GET evaluation and every absent object would come back
              # 403. distribute_zips.sh reads versions.json with
              # `aws s3 cp ... || echo '{"minors": []}'`, which cannot tell 403
              # from 404 -- a 403 there would silently reseed the index and drop
              # every previously published minor from it.
              - Sid: ListSourceCoopBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::us-west-2.opendata.source.coop

Outputs:
  BenchmarkInvokeRoleArn:
    Description: gh variable set BENCHMARK_ROLE_ARN
    Value: !GetAtt BenchmarkInvokeRole.Arn
  DeployRoleArn:
    Description: gh variable set BENCHMARK_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  ReleaseRoleArn:
    Description: gh variable set LAMBDA_RELEASE_ROLE_ARN
    Value: !GetAtt ReleaseRole.Arn
  DistBucket:
    Description: gh variable set LAMBDA_DIST_BUCKET
    Value: !Ref DistBucketName
