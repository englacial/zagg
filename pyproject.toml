[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "zagg"
dynamic = ["version"]
description = "Multi-resolution aggregation for ICESat-2 ATL06 data using morton/healpix indexing"
readme = "README.md"
# Upper bound excludes 3.14+: numpy is pinned to 2.2.6 for the arm64 Lambda layer
# (see deployment/aws/build_layer.sh), and 2.2.6 has no CPython 3.14 support — the
# ABI mismatch silently corrupts results (issue #31). Lambda runtime is 3.12.
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Shane Grigsby", email = "refuge@rocktalus.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "h5coro>=1.0.5",
    # Compiled hidefix chunk reader for the `sidecar` index backend (issue #149;
    # espg sign-off on the #149 thread). Floor is 0.3.2: the first release whose
    # SidecarIndex.read_group accepts the io_stats kwarg the worker forwards
    # unconditionally (issue #374); 0.3.1 raises TypeError on every sidecar
    # group read, which is what emptied the tdigest_healpix_o9_hive_sidecar
    # benchmark target on merge CI (espg/h5coro-hidefix#7). A floor ahead of
    # what PyPI has published (as 0.2.0 once was) fails resolution loudly — the
    # state build_layer.sh's MORTIE_SPEC derivation cites this block for.
    "h5coro-hidefix>=0.3.2",
    # Floor 0.9.10 because mortie 0.9.10 RETIRED the `mortie.toc` submodule
    # (espg/mortie#199, following #197 for `mortie.moc`): the name is now the
    # `Toc` constructor, so statement-form `from mortie.toc import X` raises —
    # its migration shim covers attribute access only, a callable cannot also
    # be a module. The flat top-level spelling this repo now uses
    # (`from mortie import Q_START_NS, Q_END_NS, TOC_MAX_NS`) exists only from
    # 0.9.10; those three names are NOT top-level in 0.9.9, so this floor and
    # the import style are one change, not two (issue #493).
    # Previously floor 0.9.9 for the SEGMENTED toc reduce (espg/mortie#177,
    # released in 0.9.9): tocs_reduce(words, offsets) is the per-group
    # semilattice join the
    # spec §8.2/§8.3 temporal companions fold with — one Rust crossing for a
    # whole cell's centroid partition, where the scalar toc_reduce 0.9.6 ships
    # would be a Python loop per centroid (issue #410,
    # zagg.stats.tdigest._centroid_envelopes). Earlier floors: 0.9.8
    # for the authalic latitude convention (espg/mortie#186, landed
    # in espg/mortie#188): binning is equal-area on the WGS84 ellipsoid by
    # construction — latitude="authalic" is the new mortie default, with
    # "geodetic-spherical" as the legacy escape. Cell ids differ between the
    # two conventions — the offset |beta - phi| peaks near 45° lat at
    # 0.12830°, ~14.26 km along the meridian (mortie spec §9) — so stores
    # built on 0.9.8 defaults are not composable with pre-authalic stores;
    # the store attr tokens are authalic-wgs84 / geodetic-spherical (same
    # section). Earlier floors: 0.9.6
    # for the MOC batch twins on ShardMap.build's stored-index path
    # (issue #396 phase 4): mocs_and, the 1xN broadcast intersection of the AOI
    # cover against the footprint_cells column (espg/mortie#173, landed in
    # espg/mortie#174) — the piece 0.9.5 lacks — chained into
    # mocs_to_orders, itself a 0.9.5 arrival
    # (espg/mortie#156). Together: two Rust crossings per
    # block of records where 0.9.5 forced a Python loop of scalar
    # moc_and/moc_to_order per granule. Earlier floors: 0.9.5
    # for the WKB batch cover behind the ``footprint_cells`` catalog
    # column (issue #396): mortie.arrow.from_wkbs, the pyarrow skin
    # (espg/mortie#163) over the backend-free Rust WKB reader
    # (espg/mortie#157), which covers a geoparquet geometry column in one
    # crossing and is what Catalog.index_footprints builds the column from.
    # 0.9.5 also deletes mortie/tools.py (espg/mortie#159's domain split); zagg
    # imports nothing from it since englacial/zagg#411. 0.9.4
    # for the batch coverage entry point — polygons_to_morton_mocs, the
    # many->many ragged sibling of morton_coverage_moc (espg/mortie#153) that
    # ShardMap.build calls once for a whole catalog instead of once per
    # granule; 0.9.3 for the reader deinterleave (issue #336) — rank_to_xy /
    # xy_to_rank, the nested-rank <-> face-local (x, y) pair the readers place cells by
    # (espg/mortie#150; normative convention in mortie's docs/specification.md
    # §8, frozen for mortie 1.x); 0.9.0 ships the decimal-emit surface shard ids
    # route through (issue #199) — decimal_repr / to_decimal, the
    # _decimal_to_word parse-back, hive_path, and the MortonIndexScalar decimal
    # display.
    # Floor 1.0.0 (issue #559): mortie 1.0 retired the plural batch names with
    # no aliases (espg/mortie#187) -- moc_and / moc_intersects / moc_to_order /
    # toc_reduce take ``offsets=``, decimal_to_word and arrow.from_wkb are the
    # array forms, polygons_to_morton_mocs is the only ring coverer -- so every
    # call in this package only resolves from 1.0.0 on.
    "mortie>=1.0.0",
    "earthaccess",
    "boto3",
    "fastparquet",
    # arro3-core is the deployed-worker Arrow carrier (issue #130): ~7 MB, zero
    # required runtime deps, importable inside the 250 MB Lambda gate — unlike
    # pyarrow, whose bindings hard-link a ~100 MB unstrippable C++ core. pyarrow is
    # NOT a core dep: after the pivot its only remaining direct use is off-Lambda
    # zagg.catalog, so it lives in the `catalog` extra (forced anyway by
    # stac-geoparquet).
    "arro3-core>=0.8.1",
    "pydantic-zarr>=0.9.1",
    "zarr>=3.1.5",
    "obstore>=0.8.2",
    "pyyaml",
    "pyproj>=3.7.0",
    "shapely",
    "odc-geo",
    # GeoTIFF/COG decode engine for the raster reader (issue #218, espg-ratified
    # on the issue): ~4 MB abi3 wheels on both layer arches, sole transitive dep
    # is obspec (pairs with obstore). Rust decode: DEFLATE + 16-bit horizontal
    # predictor verified bit-exact against GDAL on Sentinel-2 c1 COGs.
    "async-tiff>=0.7.2",
]

[project.optional-dependencies]
lambda = [
    # This extra is the single source for every exact layer pin:
    # deployment/aws/build_layer.sh derives each one at build time via its
    # lambda_pin helper (PR #436, extending issue #322's mortie pattern), and
    # tests/test_lambda_build.py fails on any literal pin reintroduced there.
    "numpy==2.2.6",
    "pandas==2.2.3",
    # arro3-core replaces pyarrow as the deployed-worker Arrow carrier (issue #130).
    "arro3-core==0.8.1",
    "h5coro==1.0.5",
    # abi3 manylinux_2_28 wheels cover both layer arches, ~2.2 MB each.
    "h5coro-hidefix==0.3.2",
    "cramjam",
    "astropy",
    # abi3 manylinux_2_28 wheels cover both layer arches, ~4 MB each — issue #218.
    "async-tiff==0.7.2",
    # The temporal worker (process_event, issue #220) reads xarray datasets and
    # opens NetCDF4/HDF5 bytes in-memory via the h5netcdf engine; h5coro is a
    # byte-range reader, not an xarray engine, so these must ship in the layer.
    # Pins resolved against numpy==2.2.6/pandas==2.2.3 on the layer's python
    # (xarray must NOT be in build_layer.sh's strip list).
    "xarray==2026.7.0",
    "h5netcdf==1.8.1",
    "h5py==3.16.0",
]
# STAC fetch + shard-map build deps. Kept out of core so the Lambda layer build
# (which doesn't run fetch/build) stays lean.
#
# Spherely (exact-S2 `SpatialIndex`) is intentionally NOT listed: it's a fork
# not on PyPI (benbovy/spherely#118), and PyPI forbids direct-URL deps. Install
# it separately for the exact-S2 catalog backend; without it, `auto` falls back
# to mortie (HEALPix) / shapely (rectilinear):
#   pip install "spherely @ https://github.com/espg/spherely/releases/download/v0.1.1-spatialindex/spherely-0.1.1+spatialindex-cp312-cp312-manylinux_2_28_x86_64.whl"
# pyarrow lives here (not core): zagg.catalog (STAC/geoparquet build) is the only
# direct pyarrow user after the issue #130 pivot, and stac-geoparquet hard-requires
# pyarrow anyway. catalog runs off-Lambda, so pyarrow never reaches the worker/layer.
catalog = [
    "stac-geoparquet>=0.7.0",
    "pyarrow",
]
# Interactive shard-map viewer (issue #38). Optional — kept out of core and out
# of `lambda` so the deployment layer stays lean. `pip install zagg[viz]`.
# ipyleaflet is a Jupyter widget; @espg approved adding it for the viewer
# (https://github.com/englacial/zagg/issues/38#issuecomment-4713639466).
viz = [
    "ipyleaflet>=0.19",
]
analysis = [
    # tqdm drives zagg.client's RunHandle.progress() bar (issue #326); espg
    # ratified adding it to this existing extra — never to `lambda` — on
    # https://github.com/englacial/zagg/issues/265#issuecomment-5124017044
    "tqdm>=4.66",
    "cubed>=0.24.0",
    "cubed-xarray>=0.0.9",
    "xarray[io]",
    "xdggs",
    "geopandas",
    "cartopy>=0.25.0",
    "matplotlib>=3.10.8",
    "notebook",
]
# Lean extra for the Lambda-benchmark CI plotting step (issue #110): just pulls in
# matplotlib (same pin as analysis) so the benchmark workflow doesn't install the
# heavy analysis stack.
benchmark = [
    "matplotlib>=3.10.8",
    # The full-AOI harness builds its shard map from a committed stac-geoparquet
    # catalog (zagg.catalog.sources -> pyarrow), and the series append writes
    # parquet via pandas; both run only in CI, off-Lambda (the worker uses
    # arro3-core, issue #130), so pyarrow lives in this CI-only extra.
    "pyarrow",
]
test = [
    "pytest>=8.0",
    "stac-geoparquet>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/englacial/zagg"
Repository = "https://github.com/englacial/zagg"
Issues = "https://github.com/englacial/zagg/issues"

[project.scripts]
zagg = "zagg.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zagg/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zagg"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/zagg",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (run with pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "W", "I", "N"]
lint.ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zagg"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.6.14",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
]
