name: Publish

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish'
        required: true
        type: string

jobs:
  # Write the ## [TAG] section of CHANGELOG.md from the PR titles merged since
  # the previous tag and push it to main (PRs never edit CHANGELOG.md -- the
  # changelog-guard job in lint.yml refuses it). Runs BESIDE the build/publish
  # chain, never in it: a changelog problem must not fail a release, so every
  # failure past generation ends in a ::warning::, not an exit 1. The generator
  # is .github/scripts/changelog_section.py (tests/test_changelog_section.py):
  # it drains [Unreleased] into a ### Notes sub-heading, lists the PRs under
  # ### Merged pull requests, and is a no-op when the tag's section exists, so
  # a workflow_dispatch replay cannot duplicate it.
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Get tag name
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Generate the release section
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_tag.outputs.tag }}
      run: |
        set -euo pipefail
        git fetch --tags --force origin
        TAG_TIME="$(git log -1 --format=%cI "refs/tags/$TAG")"
        PREV="$(git describe --tags --abbrev=0 --match '*.*.*' "$TAG^" 2>/dev/null || true)"
        PREV_TIME=""; SEARCH="is:merged"
        if [ -n "$PREV" ]; then
          PREV_TIME="$(git log -1 --format=%cI "refs/tags/$PREV")"
          SEARCH="merged:>=$PREV_TIME"
        fi
        echo "tag $TAG @ $TAG_TIME; previous ${PREV:-<none>} @ ${PREV_TIME:-<none>}"
        # The search is only a prefilter (no upper bound: GitHub stamps mergedAt
        # after the merge commit's own time, so the PR the tag sits on can
        # postdate TAG_TIME). Membership is exact -- the PR's merge commit is in
        # PREV..TAG -- with the time window only for rows lacking one. --limit
        # 500 is per release, far above any tag-to-tag PR count here (no GraphQL
        # first-100 cutoff).
        gh pr list --repo "${{ github.repository }}" --state merged --base main \
          --search "$SEARCH" --limit 500 \
          --json number,title,url,author,mergedAt,mergeCommit > "$RUNNER_TEMP/prs.json"
        git rev-list "${PREV:+$PREV..}$TAG" > "$RUNNER_TEMP/revs.txt"
        git log --no-merges --pretty='- %s (%h)' "${PREV:+$PREV..}$TAG" \
          > "$RUNNER_TEMP/commits.txt"
        python3 .github/scripts/changelog_section.py \
          --tag "$TAG" --tag-time "$TAG_TIME" \
          ${PREV_TIME:+--prev-tag-time "$PREV_TIME"} \
          --prs "$RUNNER_TEMP/prs.json" --revs "$RUNNER_TEMP/revs.txt" \
          --fallback "$RUNNER_TEMP/commits.txt" --changelog CHANGELOG.md
    - name: Commit to main (or open a PR if main refuses the push)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_tag.outputs.tag }}
      run: |
        set -uo pipefail
        if git diff --quiet -- CHANGELOG.md; then
          echo "CHANGELOG.md already carries [$TAG]; nothing to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -q -m "changelog for $TAG"
        # main may have moved since checkout: one rebase, never a force.
        git pull --rebase -q origin main || true
        if git push origin HEAD:main; then
          echo "pushed changelog for $TAG to main"
          exit 0
        fi
        # Branch protection (or a race) refused the bot: land it as a PR.
        BRANCH="changelog/$TAG"
        if ! git push origin "HEAD:refs/heads/$BRANCH"; then
          echo "::warning::could not push $BRANCH either; the CHANGELOG.md section for $TAG was NOT recorded"
          exit 0
        fi
        gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
          --title "changelog for $TAG" --label implement \
          --body "Generated by the changelog job of publish.yml for tag $TAG: main refused the direct push, so the section lands via this PR (changelog-guard exempts changelog/* branches)." \
          || echo "::warning::pushed $BRANCH but could not open its PR (it may already exist)"
        echo "::warning::main rejected the changelog push for $TAG; opened a PR from $BRANCH instead"

  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install build
      run: python3 -m pip install build --user
    - name: Build sdist and wheel
      run: python3 -m build
    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/zagg
    permissions:
      id-token: write

    steps:
    - name: Download dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zagg
    permissions:
      id-token: write

    steps:
    - name: Download dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  # Build the dual-arch Lambda zips in-line (issue #25): self-contained so the
  # release no longer depends on GITHUB_TOKEN cascade-triggering lambda-build.
  lambda-build:
    name: Build Lambda zips
    needs: publish-to-pypi
    uses: ./.github/workflows/lambda-build-reusable.yml

  github-release:
    name: Create GitHub Release
    needs: lambda-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      minor: ${{ steps.get_tag.outputs.minor }}

    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Get tag name
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "minor=$(echo "$TAG" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
    - name: Download Lambda zips
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create GitHub Release + attach Lambda zips
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${{ steps.get_tag.outputs.tag }}"
        cat > release_notes.md <<EOF
        ## Installation

        \`\`\`bash
        pip install zagg==$TAG_NAME
        \`\`\`
        EOF
        gh release create "$TAG_NAME" \
          --repo '${{ github.repository }}' \
          --title "Release $TAG_NAME" \
          --notes-file release_notes.md || echo "Release already exists"
        # Attach the four zips (the durable CloudFormation/standup artifacts).
        gh release upload "$TAG_NAME" \
          artifacts/lambda-layer-x86_64/lambda_layer_x86_64.zip \
          artifacts/lambda-layer-arm64/lambda_layer_arm64.zip \
          artifacts/lambda-function-x86_64/lambda_function_x86_64_*.zip \
          artifacts/lambda-function-arm64/lambda_function_arm64_*.zip \
          --repo "${{ github.repository }}" --clobber

  # Publish the zips to the public distribution bucket (replaces source.coop;
  # keyed by minor + a versions.json index). Skips until the bucket/role vars
  # exist, so a release before the AWS-side setup still attaches zips (above).
  distribute:
    name: Distribute zips to public bucket
    needs: github-release
    if: >-
      vars.LAMBDA_RELEASE_ROLE_ARN != '' &&
      vars.LAMBDA_DIST_BUCKET != '' &&
      vars.LAMBDA_AWS_REGION != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Download Lambda zips
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Assume release role (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.LAMBDA_RELEASE_ROLE_ARN }}
        aws-region: ${{ vars.LAMBDA_AWS_REGION }}
    - name: Distribute
      run: |
        set -euo pipefail
        mkdir -p zips
        find artifacts -name '*.zip' -exec cp {} zips/ \;
        .github/scripts/distribute_zips.sh \
          --minor "${{ needs.github-release.outputs.minor }}" \
          --tag "${{ needs.github-release.outputs.tag }}" \
          --bucket "${{ vars.LAMBDA_DIST_BUCKET }}" \
          --region "${{ vars.LAMBDA_AWS_REGION }}" \
          --dir zips

  # Update the PRODUCTION Lambda in place (tags only). Behind the `production`
  # GitHub Environment (add a required-reviewer rule). publish-layer-version +
  # update-function-configuration handles a deps change that the function-code
  # update alone would miss. Needs `distribute` so the layer is staged in S3 for
  # publish-layer-version (the layer zip can exceed the 50 MB direct-upload cap).
  # deploy_lambda.sh updates the WHOLE worker-size variant family (base +
  # ${FN}-<mem>[-disk], issue #341) from the same zip, so the pre-provisioned
  # variants (e.g. process-shard-4096-disk) no longer stay on standup-time code.
  deploy-prod:
    name: Deploy production Lambda
    needs: [github-release, distribute]
    # Gate on EVERY var this job consumes (not just the role): the "no
    # unstaged-layer deploy" safety currently rests on distribute's skip
    # propagating here, and a partial config must skip, never half-deploy prod.
    if: >-
      vars.LAMBDA_RELEASE_ROLE_ARN != '' &&
      vars.LAMBDA_DIST_BUCKET != '' &&
      vars.LAMBDA_AWS_REGION != '' &&
      vars.LAMBDA_PROD_FUNCTION_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Download arm64 function zip
      uses: actions/download-artifact@v4
      with:
        name: lambda-function-arm64
        path: fn
    - name: Assume release role (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.LAMBDA_RELEASE_ROLE_ARN }}
        aws-region: ${{ vars.LAMBDA_AWS_REGION }}
    - name: Update function (layer + code, in place)
      env:
        FUNCTION_NAME: ${{ vars.LAMBDA_PROD_FUNCTION_NAME }}
        DIST_BUCKET: ${{ vars.LAMBDA_DIST_BUCKET }}
        MINOR: ${{ needs.github-release.outputs.minor }}
        REGION: ${{ vars.LAMBDA_AWS_REGION }}
      run: |
        set -euo pipefail
        # Layer was staged to the dist bucket by `distribute` (this job needs it).
        .github/scripts/deploy_lambda.sh \
          --function "$FUNCTION_NAME" \
          --layer-bucket "$DIST_BUCKET" \
          --layer-key "${MINOR}/lambda_layer_arm64.zip" \
          --function-zip "$(ls fn/lambda_function_arm64_*.zip)" \
          --region "$REGION"
