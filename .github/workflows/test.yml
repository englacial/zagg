name: Tests

on:
  push:
    branches: [main, lambda]
  pull_request:
    types: [assigned, opened, synchronize, reopened]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14+ intentionally excluded: numpy 2.2.6 (pinned for the arm64 Lambda
        # layer) has no cp314 wheels -> ABI mismatch / silent wrong results (#31).
        # Lambda runtime is 3.12; keep the dev/CI matrix on supported pairings.
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra test

    - name: Run tests with pytest
      # Whole test modules run in parallel, one module per worker at a time (issue #669):
      # tests inside a module keep their order and module-scoped fixtures.
      run: uv run pytest -n auto --dist loadfile --cov=zagg --cov-report=xml --cov-report=term
      env:
        # Coverage's sys.monitoring tracer (Python 3.12+, PEP 669): far less per-line overhead than
        # the settrace tracer, which got slower in 3.12. zagg requires >=3.12, so every job can use it.
        COVERAGE_CORE: sysmon
