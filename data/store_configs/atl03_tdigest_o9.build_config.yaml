aggregation:
  coordinates:
    morton:
      dtype: uint64
      fill_value: 0
  streaming:
    mode: spill
  variables:
    composition:
      attrs:
        composition:
          lanes:
          - land
          - ocean
          - sea_ice
          - land_ice
          - inland_water
          - low
          - med
          - high
          of: h_tdigest_signal
          spec: zagg-composition/1
          threshold: 2
      dtype: uint64
      fill_value: 0
      function: zagg.stats.composition.pack_composition
      params:
        conf_inland_water: signal_conf_inland_water
        conf_land: signal_conf_land
        conf_land_ice: signal_conf_land_ice
        conf_ocean: signal_conf_ocean
        conf_sea_ice: signal_conf_sea_ice
        threshold: 2
      source: h_ph
    count:
      dtype: int32
      fill_value: 0
      function: len
      source: h_ph
    h_tdigest_noise:
      attrs:
        signal_threshold: 2
        stratum: noise
      dtype: float32
      fill_value: 0
      function: zagg.stats.tdigest.build_tdigest_where
      inner_shape:
      - 2
      kind: ragged
      location: leaf_id
      overview_delta: 512
      params:
        delta: 4096
        where: ~((signal_conf_land >= 2) | (signal_conf_ocean >= 2) | (signal_conf_sea_ice
          >= 2) | (signal_conf_land_ice >= 2) | (signal_conf_inland_water >= 2))
      source: h_ph
      temporal: per-centroid
    h_tdigest_signal:
      attrs:
        signal_threshold: 2
        stratum: signal
      dtype: float32
      fill_value: 0
      function: zagg.stats.tdigest.build_tdigest_where
      inner_shape:
      - 2
      kind: ragged
      location: leaf_id
      overview_delta: 512
      params:
        delta: 4096
        where: (signal_conf_land >= 2) | (signal_conf_ocean >= 2) | (signal_conf_sea_ice
          >= 2) | (signal_conf_land_ice >= 2) | (signal_conf_inland_water >= 2)
      source: h_ph
      temporal: per-centroid
bounds: null
catalog: null
data_source:
  base_level: photons
  coordinates:
    latitude: /{group}/heights/lat_ph
    longitude: /{group}/heights/lon_ph
  driver: s3
  filters:
  - column: 0
    dataset: /{group}/heights/signal_conf_ph
    op: ne
    value: -2
  groups:
  - gt1l
  - gt1r
  - gt2l
  - gt2r
  - gt3l
  - gt3r
  index:
    backend: sidecar
    on_miss: build
    store: s3://sliderule-public-cors/zagg-index/ATL03/007
  levels:
    photons:
      coordinates:
        latitude: lat_ph
        longitude: lon_ph
      link: null
      path: /{group}/heights
    segments:
      coordinates:
        latitude: reference_photon_lat
        longitude: reference_photon_lon
      link:
        count: /{group}/geolocation/segment_ph_cnt
        index_base: 1
        index_beg: /{group}/geolocation/ph_index_beg
        to: photons
      path: /{group}/geolocation
  read_plan:
    pad: 1
    spatial_index: segments
  reader: h5coro
  variables:
    delta_time: /{group}/heights/delta_time
    h_ph: /{group}/heights/h_ph
    signal_conf_inland_water:
      column: 4
      path: /{group}/heights/signal_conf_ph
    signal_conf_land:
      column: 0
      path: /{group}/heights/signal_conf_ph
    signal_conf_land_ice:
      column: 3
      path: /{group}/heights/signal_conf_ph
    signal_conf_ocean:
      column: 1
      path: /{group}/heights/signal_conf_ph
    signal_conf_sea_ice:
      column: 2
      path: /{group}/heights/signal_conf_ph
output:
  grid:
    child_order: 19
    chunk_inner: 13
    indexing_scheme: nested
    parent_order: 9
    sharded: true
    type: healpix
  pyramid: {}
  store_layout: hive
  time_source:
    epoch: '2018-01-01T00:00:00'
    field: delta_time
    scale: gps
    units: seconds
pipeline:
  type: spatial
worker:
  extra_disk: true
  memory: 4096
