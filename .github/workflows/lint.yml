name: Lint

on:
  pull_request:
    branches: [main, lambda]
    # labeled/unlabeled re-run the changelog guard when its escape-hatch label
    # is toggled; the ruff job skips those two events.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  ruff:
    name: ruff
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: benny123tw/action-ruff@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: diff_context
          fail_level: none
          ruff_flags: "--select=E,F,W,I --ignore=E501"

  # CHANGELOG.md is written at release by publish.yml's `changelog` job from the
  # merged PR titles (CLAUDE.md section 3), so a PR touching it is refused.
  # Escape hatches: the `changelog` label (a deliberate hand note under
  # [Unreleased]) and the bot's own changelog/<tag> fallback branch.
  changelog-guard:
    name: changelog guard
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'changelog') &&
      !startsWith(github.head_ref, 'changelog/')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse hand edits to CHANGELOG.md
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is generated at release from merged PR titles (publish.yml changelog job). Drop this edit and make the PR title the release-note line, or add the 'changelog' label for a deliberate hand note under [Unreleased]."
            exit 1
          fi
          echo "CHANGELOG.md untouched"
