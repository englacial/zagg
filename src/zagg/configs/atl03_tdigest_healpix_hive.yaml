# ATL03 photon-height t-digest (HEALPix, hive store layout) -- the demo-notebook
# template (issue #328). Grid, read plan, and aggregation match the benchmark
# hive arm (tests/data/benchmark/configs/atl03_tdigest_healpix_o9_hive.yaml);
# packaged so ``default_config("atl03_tdigest_healpix_hive")`` works from any
# install, no repo checkout. See atl03_tdigest_healpix.yaml for the flat-layout
# sibling and the full t-digest field commentary.
data_source:
  granule_workers: 4
  reader: h5coro
  driver: s3
  index:
    backend: inline            # virtual chunk-index for the byte-range reads;
                               # omit the block for the pure hierarchical metadata walk
  groups: [gt1l, gt1r, gt2l, gt2r, gt3l, gt3r]
  coordinates:
    latitude: "/{group}/heights/lat_ph"
    longitude: "/{group}/heights/lon_ph"
  variables:
    h_ph: "/{group}/heights/h_ph"
    # The per-photon clock ``output.windowing`` bins on (issue #638): GPS
    # seconds since 2018-01-01, as in atl03_tdigest_strata_healpix.
    delta_time: "/{group}/heights/delta_time"
  filters:
    - dataset: "/{group}/heights/signal_conf_ph"
      column: 0                  # land surface type; TEP is uniform across columns
      op: ne
      value: -2
  base_level: photons
  levels:
    photons:
      path: "/{group}/heights"
      coordinates: {latitude: lat_ph, longitude: lon_ph}
      link: null
    segments:
      path: "/{group}/geolocation"
      coordinates: {latitude: reference_photon_lat, longitude: reference_photon_lon}
      link:
        to: photons
        index_beg: "/{group}/geolocation/ph_index_beg"
        count: "/{group}/geolocation/segment_ph_cnt"
        index_base: 1            # ATL03 ph_index_beg is 1-based per the v3 dict
  read_plan:
    spatial_index: segments
    pad: 1                       # one segment of padding on each side per #43

aggregation:
  streaming:
    mode: spill                # bounded read buffers spilled to /tmp partitions, one
                               # aggregate pass after the reads (pooled-identical in the
                               # single-block regime; every reducer). Omit the block for
                               # the fully-pooled path; mode: merge folds incrementally
                               # (mergeable reducers only). Pairs with worker.extra_disk.
                               # buffer_granules defaults to 20 (issue #474);
                               # block_bytes caps a spill block before it closes
                               # and folds (absent: disk-derived default). Keep it
                               # at or below ~45% of the variant's ephemeral storage:
                               # a closing block stays resident beside the filling
                               # one, and the /tmp guard reserves both.
  coordinates:
    morton:
      dtype: uint64
      fill_value: 0
  variables:
    count:
      function: len
      source: h_ph
      dtype: int64
      fill_value: 0
    h_tdigest:
      # Per-cell t-digest of photon heights: (n_centroids, 2) ragged payload of
      # (mean, weight) centroids; any quantile is recovered at read time.
      kind: ragged
      function: "zagg.stats.tdigest.build_tdigest"
      source: h_ph
      inner_shape: [2]
      params:
        delta: 4096              # leaf centroid budget (espg ruling 2026-09-13): the
                                 # live stores' value, and loss-free for every
                                 # surface cell measured -- the CA tail scan on
                                 # issue #422 puts 1e-5 of cells above it, all
                                 # cloud/background storm artifacts
      overview_delta: 128        # pyramid-fold budget (issue #424; v4 ruling, issue
                                 # #638): overview digests capped at 128 centroids,
                                 # following atl03_tdigest_strata_healpix. Hash-
                                 # invisible; the leaf ``delta`` above is unchanged
      dtype: float32
      fill_value: 0

output:
  grid:
    type: healpix
    indexing_scheme: nested
    parent_order: 9              # shard / dispatch unit: 4^(19-9) = 1024x1024 cells
    chunk_inner: 13              # inner Zarr chunk: 4^(19-13) = 64x64 cells (K=256 per shard)
    sharded: true                # one ShardingCodec object per array per leaf
    child_order: 19              # leaf cell resolution (~10 m)
  store_layout: hive             # each dispatched shard writes its own leaf zarr
  # Windowed, yearly, from birth (issue #638, espg ruling 2026-10-12): one
  # leaf per (shard, calendar year) plus the ``all`` row, which a windowed
  # config allocates at init (``pyramid.all_time`` resolves true, issue
  # #623) -- so neither ``all_time`` nor ``icechunk`` is spelled here (a
  # windowed hive store gets its Icechunk repo at birth, issue #604, one
  # manifest per row). The schedule is fixed at a store's birth and only
  # folds UP later (a year is the merge of its months, never the reverse),
  # so the template carries the schedule the product is meant to have;
  # monthly is a deliberate per-store choice (~6.5x the compute). Windowed
  # emit is what scales: worker peak memory 3.7 -> 1.56 GB (issue #586),
  # and a window invoke reads only its year's granules. This template's
  # ``semantic_hash`` moved for two reasons (it is not pinned; the strata
  # template is, in tests/test_live_store_templates.py): ``windowing`` is a
  # D13 leaf-shaping key, and the new ``data_source.variables.delta_time``
  # is D19 core -- a windowed store is a different product from the
  # unwindowed one. Delete the block to build an unwindowed store; ``unit``
  # stays at its default ``shard``.
  windowing:
    schedule: yearly
    time_field: delta_time       # the per-photon clock, declared under
                                 # data_source.variables above
    epoch: "2018-01-01T00:00:00"
    scale: gps
    units: seconds
  sweep: stages                  # spelled, not left to the default: the Icechunk commit
                                 # regime keys on the EXPLICIT key (PR #622 ruling (1),
                                 # zagg.icechunk_refs.ladder_walks), so a run from this
                                 # template commits refs up the ladder -- one commit per
                                 # commit-order node, the regime that scales to the globe
                                 # (spec §11.4) -- instead of one commit per leaf. Also
                                 # what the default resolves to (issue #620); hash-
                                 # invisible (a run trigger, D9).
  pyramid:
    overviews: [16, 15, 14, 13]  # the leaf ladder, following atl03_tdigest_strata_healpix
                                 # exactly (issue #620, espg's ruling on PR #622 question
                                 # (2)): a contiguous column tier from cells 16 down to
                                 # 13 = shard order 9 + 4, the fixed every-order ladder
                                 # above the shard. Hash-invisible (D11). A hive store that
                                 # declares a ladder chains the staged sweep by default;
                                 # `sweep: stages` above spells it anyway.

worker:
  memory: 4096                   # pre-provisioned Lambda variant, MB (2048|4096|8192) --
                                 # picks the process-shard-<memory> function and keys both
                                 # the pre-invoke cost ceiling and the metered rollup
  extra_disk: true               # the -disk twin: memory+2048 MB of /tmp, backing the
                                 # spill partitions (aggregation.streaming.mode: spill)
