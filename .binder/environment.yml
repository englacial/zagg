# Conda environment for Binder / repo2docker.
#
# repo2docker (which Binder runs) builds this with mamba, so the env solves
# fast. We keep the conda layer thin: just Python plus the system geospatial
# stack (GEOS / PROJ / GEOTIFF) that cartopy, pyproj and shapely link against.
# Everything Python-side -- zagg itself and its notebook runtime -- is installed
# from the repo's ``[analysis]`` optional-dependency extra in ``postBuild`` so
# there is a single source of truth for the notebook dependencies (pyproject.toml).
#
# Only PyPI/conda-forge resolvable packages appear here: no ``git+`` URLs and no
# spherely fork. The two Binder notebooks (hhdc_viewer, waveform_viewer) READ the
# anonymous public source.coop demo stores and build no catalogs at all, so no
# SpatialIndex backend is on their import path -- exact-S2 spherely least of all.
#
# NOTE (2026-09-10, was 2026-08-26): ``postBuild`` installs ``[analysis,catalog,viz]``.
# ``viz`` (ipyleaflet) is LOAD-BEARING and must stay: ``hhdc_viewer``'s footprint
# map imports ``ipyleaflet`` (``from ipyleaflet import GeoJSON, Map``), and like
# ipympl it is a frontend extension, so a mid-session ``%pip install`` in the
# notebook cannot recover it -- the image is the only place it can come from.
# ``catalog`` (stac-geoparquet) was carried for the jupyterhub_example /
# shardmap_viewer notebooks, which have been archived off main; it -- and much of
# ``analysis`` -- is now dead weight and could be trimmed to speed the build.
# Left in place rather than trimmed blind: that is a dependency change, and the
# image is not the place to discover a transitive need.
name: zagg-binder
channels:
  - conda-forge
  - nodefaults
dependencies:
  # zagg requires Python >=3.12,<3.14; the AWS Lambda runtime is 3.12.
  - python=3.12
  # System geospatial libraries. Bundling the non-Python GEOS/PROJ deps from
  # conda-forge is the reason we use a conda env on Binder (espg, issue #104):
  # it gives cartopy a system GEOS/PROJ to link against without a from-source
  # build. (pyproj/shapely ship vendored copies in their manylinux wheels, so
  # these are mainly for cartopy.)
  - geos
  - proj
  - pip
  # The Python packages (zagg + the ``analysis`` extra) are installed via pip
  # in postBuild against the checked-out repo, so the notebook dependency set
  # stays defined once in pyproject.toml.
